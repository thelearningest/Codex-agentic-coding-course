<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Module 3 · Course Companion</title>
<style>
*{box-sizing:border-box} :root{color-scheme:dark;--gold:#ffd666;--muted:#b8b7af;--line:#3c3a32;--room:url('../../prototypes/mvp-3-course-experience-companion/assets/home-base.png')}body{margin:0;background:#11110f;color:#fffdfa;font:16px/1.6 'Be Vietnam Pro',system-ui,sans-serif}button,textarea{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,a:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:3px}header{min-height:68px;padding:12px 3vw;display:flex;align-items:center;gap:13px;border-bottom:2px solid var(--gold);background:#090908}header b{line-height:1.2}header small{margin-left:auto;color:var(--muted)}.mark{font:800 19px monospace;color:var(--gold);border:2px solid;padding:5px;box-shadow:2px 2px var(--gold)}.grid{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:calc(100vh - 68px)}aside{padding:30px 18px;border-right:1px solid var(--line);background:#161614}aside h2{font-size:18px;margin:0 8px 20px}nav{display:grid;gap:6px}nav button{min-height:48px;text-align:left;border:1px solid transparent;background:transparent;border-radius:8px;color:#bebdb6;padding:8px 12px;display:flex;align-items:center;gap:12px;font-weight:540}nav button span{font:13px monospace;color:#aaa79d}nav button[aria-current=true]{border-color:#6a5b31;background:#302a1d;color:#ffe096}nav button:hover,.secondary:hover{background:#302f29}main{padding:clamp(16px,3vw,48px);min-width:0}.board{max-width:1120px;margin:auto;border:1px solid var(--line);border-radius:18px;background:#171714;overflow:hidden}.scene{min-height:198px;position:relative;background:linear-gradient(90deg,#13120feb 0%,#181610c9 34%,#19150e25),var(--room) center 52%/cover;display:flex;align-items:end;padding:28px 5%;isolation:isolate}.scene img{position:absolute;right:4%;bottom:0;height:92%;z-index:-1;object-fit:contain}.scene h1{font-size:clamp(26px,3.3vw,46px);letter-spacing:-.045em;line-height:1.18;margin:8px 0 0;max-width:75%;text-shadow:0 2px 8px #000}.eyebrow{font:700 13px/1.4 system-ui;color:#ffdb7c;letter-spacing:.06em}.body{padding:24px 5% 28px}.teacher{font-weight:750;display:flex;align-items:center;gap:8px}.teacher b{font:800 11px system-ui;background:var(--gold);color:#201800;border-radius:15px;padding:4px 9px}.body p{max-width:66ch}blockquote{margin:18px 0;padding:13px 20px;border-left:3px solid var(--gold);background:#23231f;border-radius:0 8px 8px 0}.actions{border-top:1px solid var(--line);padding-top:18px;margin-top:24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.primary,.secondary{border-radius:9px;padding:10px 18px;min-height:44px;font-weight:700;border:1px solid var(--line)}.primary{background:var(--gold);color:#1c170c;border-color:var(--gold)}.primary:hover{background:#ffe391}.secondary{background:#21211e}.primary:disabled{background:#34332e;color:#b7b4ab;border-color:#49473f;cursor:default}summary{cursor:pointer;padding:9px 0}code{color:#ffe09a;font-size:.95em}.browser{margin:18px 0;border:1px solid #555348;border-radius:11px;overflow:hidden}.bar{padding:7px 14px;background:#33332f;font-size:12px;color:#dedbd0}.folio{background:#f0eee7;color:#202b32;padding:22px 6%}.folio small{font:600 12px monospace;letter-spacing:.08em}.folio h2{font:normal clamp(26px,4vw,48px)/1.1 Georgia,serif;letter-spacing:-.045em;margin:12px 0}.folio p{margin:6px 0}.folio a{color:#365744}.box{border-top:1px solid var(--line);padding:14px 0}.box strong{display:block}.observation{display:block;margin:16px 0 5px}.status{color:var(--muted);font-size:14px}.status:empty{display:none}textarea{width:100%;padding:10px 14px;background:#10100f;color:#fff;border:1px solid #716f64;border-radius:8px;resize:vertical;min-height:76px}.check{display:flex;align-items:start;gap:10px;margin:14px 0}.check input{width:19px;height:19px;accent-color:var(--gold);margin:4px 0;flex-shrink:0}.foot{font-size:13px;color:var(--muted);margin:16px auto;max-width:1120px}.foot a{color:inherit}.foot details{margin-bottom:8px}.reset{font:inherit;color:inherit;text-decoration:underline;background:none;border:0;padding:5px 0}a{color:#ffe19a}dialog{border:1px solid #625f52;border-radius:14px;color:white;background:#22221f;padding:20px;max-width:min(90vw,540px)}dialog::backdrop{background:#000a}dialog p{white-space:pre-line}@media(max-width:800px){.grid{grid-template-columns:1fr}aside{padding:12px 5vw;border-right:0;border-bottom:1px solid var(--line)}aside h2{display:none}nav{display:flex;overflow:auto;gap:6px}nav button{white-space:nowrap;flex:none;padding:5px 10px;min-height:40px}nav button span{display:none}.scene{min-height:148px}.body{padding:18px}.scene h1{max-width:78%}header small{font-size:11px}.actions button{flex:1 1 auto}}@media(max-width:460px){.grid{display:block}header{padding:10px 15px}main{padding:14px}.scene img{right:0;height:78%}.actions{align-items:stretch;flex-direction:column}}
</style>
<header><span class="mark" aria-hidden="true">&gt;_</span><b>Course Companion</b><small>Prototype · Module 3</small></header><div class="grid"><aside><h2>Module 3</h2><nav aria-label="Xem các màn hình mẫu"></nav></aside><main><article class="board"><div class="scene"><img alt="" src="../../course-companion/src/renderer/src/assets/teacher-triet.png"><div><span class="eyebrow" id="kind"></span><h1 tabindex="-1"></h1></div></div><div class="body" id="content"></div></article><div class="foot"><details><summary>Về prototype</summary>Task Codex, portfolio và kết quả review trong bản này đều là mô phỏng. Mục lục cho phép xem riêng từng màn hình. <a href="https://mobbin.com/screens/f91726c7-28d7-4144-8957-35666b76edf4?utm_source=codex&utm_medium=ai-assistant&utm_source_platform=mcp">Coursera trên Mobbin</a> · <a href="https://mobbin.com/screens/1c7359a6-357f-465e-83c7-cc2bae83d57e?utm_source=codex&utm_medium=ai-assistant&utm_source_platform=mcp">Plane trên Mobbin</a></details><button class="reset" id="restart">Xem lại từ đầu</button></div></main></div>
<dialog id="info"><p id="message"></p><button class="primary" onclick="info.close()">Đóng</button></dialog>
<script>
const titles=['Tạo bản portfolio đầu tiên','Xem bản đầu tiên','Mở portfolio trên máy','Debug cùng coding agent','Kiểm tra và nộp portfolio','Kết quả Practice'];
const labels=['Giao việc cho Codex','Xem bản đầu','Mở lại portfolio','Học và thực hành','Kiểm tra cuối','Kết quả'];
const promptText='Hãy đọc năm tài liệu planning trong thư mục này và xây bản portfolio đầu tiên theo implementation plan đã duyệt. Khi website chạy được, gửi tôi đường dẫn để xem.';
const teacher='<div class="teacher"><b>TEACHER</b> Triết</div>';
const preview='<div class="browser"><div class="bar">Portfolio mẫu · xem trên máy</div><div class="folio"><small>PORTFOLIO / MAI</small><h2>Mai Nguyễn</h2><p>Thiết kế trải nghiệm người dùng.</p><details><summary>Dự án chọn lọc</summary><p>Thiết kế lại luồng đặt lịch cho một ứng dụng học tập.</p></details><details><summary>Liên hệ</summary><p>mai@example.com</p></details></div></div>';
const button=(id,label,primary=false)=>'<button class="'+(primary?'primary':'secondary')+'" id="'+id+'">'+label+'</button>';
const row=(...items)=>'<div class="actions">'+items.join('')+'</div>';
const el=id=>document.getElementById(id);
const key='module3-design-review-01';let state={page:0};try{Object.assign(state,JSON.parse(localStorage.getItem(key)||'{}'))}catch{};if(!Number.isInteger(state.page)||state.page<0||state.page>5)state.page=0;
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{}}
function go(n){state.page=n;save();render();document.querySelector('h1').focus({preventScroll:true});window.scrollTo(0,0)}
function message(s){el('message').textContent=s;el('info').showModal()}
function on(id,fn){if(el(id))el(id).onclick=fn}
function render(){
 const n=state.page,c=el('content');document.querySelector('h1').textContent=titles[n];el('kind').textContent=['PRACTICE','PRACTICE','BÀI HỌC','BÀI HỌC','PRACTICE','REVIEW MÔ PHỎNG'][n];
 const nav=document.querySelector('nav');nav.innerHTML=labels.map((s,i)=>'<button aria-current="'+(i===n)+'"><span>0'+(i+1)+'</span>'+s+'</button>').join('');[...nav.children].forEach((b,i)=>b.onclick=()=>go(i));nav.children[n].scrollIntoView({block:'nearest',inline:'nearest'});
 if(n===0)c.innerHTML=teacher+'<p>Bạn đã có kế hoạch từ Module 2. Hãy tiếp tục trong cùng task Codex và giao cho agent xây bản đầu tiên.</p><blockquote>'+promptText+'</blockquote>'+row(button('copy','Sao chép prompt'),button('next','Mở task Codex mẫu ↗',true))+'<div class="status" role="status" id="copied"></div>';
 if(n===1)c.innerHTML='<strong>Portfolio của tôi</strong><p>Trong task Codex, mở đường dẫn agent gửi. Khi thấy nội dung portfolio của mình, bạn có thể quay lại bài học.</p>'+button('peek',state.preview?'Ẩn bản xem thử':'Mở portfolio mẫu')+(state.preview?preview:'')+row(button('retry','Website chưa mở được'),button('next','Quay lại bài học',true));
 if(n===2)c.innerHTML=teacher+'<p>Lần đầu, bạn đã mở portfolio từ đường dẫn agent gửi. Lần sau, nếu đường dẫn đó không còn hoạt động, hãy mở lại task Codex và nhắn:</p><blockquote>Hãy chạy lại portfolio và gửi tôi đường dẫn để xem trên trình duyệt.</blockquote><p>Với một số dự án, agent sẽ dùng <code>npm run dev</code> để chạy website trên máy của bạn. Bạn có thể nhờ agent chỉ cách mở lại dự án của mình.</p>'+row(button('back','← Trang trước'),button('next','Tiếp tục',true));
 if(n===3)c.innerHTML=teacher+'<p>Khi gặp một bug có thể nhìn thấy trên màn hình, hãy chụp lại bug đó và gửi ảnh cho coding agent.</p><p>Đừng chỉ gửi ảnh. Hãy nói thêm bạn đang làm gì, bạn mong đợi điều gì và kết quả thực tế ra sao.</p><details><summary>Các trang bài học tiếp theo</summary>Ảnh lỗi và prompt mẫu · Log · Lỗi lặp lại · Git và GitHub · Commit · Push · Branch · Merge · Tóm lại</details>'+row(button('back','← Trang trước'),button('next','Đến lượt Practice cuối',true));
 if(n===4)c.innerHTML='<p>Tiếp tục trong cùng task Codex. Đối chiếu website với PRD, rồi thử các thao tác trong implementation plan trên máy tính và kích thước màn hình điện thoại.</p><details><summary>Xem yêu cầu trong PRD mẫu</summary>Người xem đọc được dự án chọn lọc và mở được thông tin liên hệ của Mai trên cả hai kích thước màn hình.</details><details><summary>Mở bản portfolio cần kiểm tra</summary>'+preview+'</details><label class="observation" for="note">Bạn đã thử gì và thấy kết quả thế nào?</label><textarea id="note" placeholder="Ghi quan sát của bạn"></textarea><label class="check"><input id="accept" type="checkbox">Tôi đã xem và chấp nhận phiên bản này.</label>'+row(button('revise','Cần chỉnh sửa'),button('submit','Chấp nhận website và nộp bài',true));
 if(n===5)c.innerHTML='<strong>'+(state.sent?'Practice đạt · kết quả minh họa':'Xem trước kết quả đạt')+'</strong><p>Portfolio đã sẵn sàng cho phần phát hành. Bước tiếp theo là năm câu tổng kết Module 3.</p>'+row(button('back','Xem lại bản nộp'),button('quiz','Mở tổng kết mẫu',true));
 on('copy',async()=>{try{await navigator.clipboard.writeText(promptText);el('copied').textContent='Đã sao chép prompt.'}catch{message(promptText)}});
 on('back',()=>go(n-1));on('next',()=>go(n+1));on('peek',()=>{state.preview=!state.preview;save();render();el('peek').focus()});
 on('retry',()=>message('Tiếp tục trong cùng task và nhắn cho agent: “Tôi chưa mở được portfolio từ đường dẫn bạn gửi. Hãy kiểm tra và gửi lại đường dẫn đang chạy.”'));
 if(n===4){const note=el('note'),accept=el('accept');note.value=state.note||'';accept.checked=!!state.accept;function sync(){state.note=note.value;state.accept=accept.checked;el('submit').disabled=!accept.checked||!note.value.trim();save()}note.oninput=accept.onchange=sync;sync();on('revise',()=>{accept.checked=false;sync();message('Quay lại cùng task Codex, mô tả điều cần sửa và yêu cầu agent cập nhật website. Sau đó thử lại đúng thao tác trên bản mới.');});on('submit',()=>{state.sent=true;go(5)})}
 on('quiz',()=>message('Tiếp theo là phần tổng kết gồm năm câu hỏi hiện có của Module 3. Đây là điểm kết thúc của prototype.'));
}
el('restart').onclick=()=>{state={page:0};go(0)};render();
</script></html>
