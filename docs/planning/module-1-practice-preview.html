<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thực hành cùng Codex và Triết · Module 1</title>
<style>
  :root { color-scheme: dark; --canvas: #100f0e; --ink: #f4f2ec; --muted: #b8b5ad; --line: #383630; --gold: #ffda72; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--canvas); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
  .page { width: min(1016px, max(800px, calc((100svh - 260px) * 1.85)), calc(100% - 72px)); margin: 0 auto; padding: 26px 0 36px; }
  .context { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; font-weight: 550; }
  .module { color: var(--gold); }
  .slash { color: #78756c; font-weight: 400; }
  h1 { font-size: clamp(27px, 3.1vw, 42px); letter-spacing: -.037em; line-height: 1.19; margin: 24px 0 9px; font-weight: 670; }
  .instruction { color: #cbc8c1; margin: 0 0 22px; line-height: 1.6; text-wrap: pretty; }
  .instruction strong { color: var(--ink); font-weight: 620; }
  figure { margin: 0; }
  .viewport { overflow: hidden; position: relative; border-radius: 16px; border: 1px solid #44453b; background: #171c16; }
  .scene { aspect-ratio: 1616 / 876; position: relative; container-type: inline-size; isolation: isolate; }
  .photo { position: absolute; inset: 0; width: 100%; height: 100%; }
  .callout { position: absolute; inset: 0; pointer-events: none; }
  .leader { position: absolute; inset: 0; background: var(--gold); clip-path: polygon(78.4% 57.9%, 82.6% 57.9%, 92.95% 90.6%, 92.8% 90.79%, 82.48% 58.22%, 78.4% 58.22%); }
  .open { position: absolute; inset: 0; border: 0; padding: 0; background: transparent; color: var(--ink); pointer-events: none; }
  .lens, .origin { position: absolute; display: block; pointer-events: auto; }
  .lens { left: 62.8%; top: 35.5%; width: 15.8%; aspect-ratio: .89; border: 1px solid #e8c874; border-radius: 16px; background: #161a15; overflow: hidden; box-shadow: 0 8px 28px #0006; }
  .lens img { display: block; width: 136%; height: 123%; position: absolute; max-width: none; left: -27%; top: -10%; object-fit: fill; }
  .lens-label { position: absolute; inset: auto 0 0; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 26%; padding: 4px; border-top: 1px solid #827246; background: #24231b; color: var(--gold); font-size: clamp(13px, 1.55cqw, 17px); font-weight: 650; }
  .lens-label i { font-size: 1.12em; font-style: normal; }
  .origin { left: 93%; top: 89.05%; width: 5.8%; height: 6.7%; border: 2px solid var(--gold); border-radius: 30px; box-shadow: 0 0 0 4px #ffda7222; }
  .origin::after { content: ""; position: absolute; inset: -13px; }
  .open:hover .lens, .open:focus-visible .lens { border-color: white; box-shadow: 0 0 0 3px #ffda725c; }
  .open:focus-visible { outline: 0; }
  .submit { position: absolute; left: 68.65%; top: 22.94%; width: 28.15%; height: 6.73%; display: grid; place-items: center; padding: 0; border-radius: clamp(5px, .8cqw, 9px); border: 0; outline: 1px solid var(--gold); outline-offset: 3px; background: #ffda72; color: #211b0e; font-size: clamp(13px, 1.68cqw, 19px); font-weight: 700; }
  .submit::after { position: absolute; content: ""; inset: -5px 0; }
  .submit:hover, .cta:hover { background: #ffe59b; }
  .submit:focus-visible { outline: 3px solid white; }
  .receipt { position: absolute; inset: 0; display: grid; place-items: center; background: #0a0b09bb; }
  .receipt-inner { text-align: center; padding: 22px; color: var(--ink); background: #1b1c17; border: 1px solid #514d3d; border-radius: 14px; min-width: 215px; }
  .receipt-inner p { font-weight: 630; font-size: 20px; margin: 0 0 14px; }
  .replay { border: 1px solid #716e60; border-radius: 8px; background: transparent; padding: 6px 18px; color: var(--ink); }
  .replay:hover { background: #35342b; }
  .controls { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-top: 17px; }
  .steps { display: flex; align-items: center; gap: 12px; }
  .step { display: inline-flex; align-items: center; gap: 8px; border: 0; padding: 8px 0; background: transparent; color: var(--muted); font-weight: 550; font-size: 14px; }
  .step:hover { color: white; }
  .step[aria-current="step"] { color: var(--gold); }
  .step span { width: 23px; height: 23px; display: grid; place-items: center; border: 1px solid #716e62; border-radius: 50%; font-size: 12px; font-variant-numeric: tabular-nums; }
  .step[aria-current="step"] span { background: #383120; border-color: #a78d50; }
  .join { height: 1px; width: 25px; background: #514d42; }
  .cta { display: inline-flex; justify-content: center; align-items: center; gap: 18px; padding: 11px 20px; min-height: 46px; color: #201a10; background: var(--gold); border: 0; border-radius: 9px; font-weight: 670; font-size: 15px; }
  .cta b { font-size: 20px; font-weight: 400; line-height: 1; }
  .simulation .cta { color: var(--ink); border: 1px solid var(--line); background: #25241f; }
  .simulation .controls { justify-content: flex-end; }
  .sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  @media (max-width: 700px) {
    .page { width: calc(100% - 32px); padding-top: 20px; }
    .context { font-size: 12px; gap: 8px; }
    h1 { margin-top: 23px; }
    .instruction { margin-bottom: 16px; }
    .viewport { border-radius: 12px; }
    .scene { width: 145%; margin-left: -45%; }
    .lens { width: 19%; left: 60%; top: 34%; border-radius: 12px; }
    .controls { flex-wrap: wrap; margin-top: 12px; }
    .steps { gap: 8px; }
    .step { min-height: 44px; }
    .join { width: 16px; }
    .receipt { left: 31%; }
  }
  @media (max-width: 500px) {
    .scene { width: 185%; margin-left: -85%; }
    .controls { gap: 12px; }
    .cta { width: 100%; }
    .receipt { left: 46%; }
  }
</style>

<script>
  const get = id => document.getElementById(id);
  const guide = { context: get('context').textContent, title: get('title').textContent, instruction: get('instruction').innerHTML };
  let simulation = false;
  const practiceHints = {
    closed: 'Bấm <strong>Mở Triết</strong> ở góc dưới bên phải cửa sổ Codex.',
    open: 'Làm theo hướng dẫn của mình ở mục <strong>Tiếp theo</strong>. Khi làm xong, bạn bấm <strong>Nộp bài</strong> nhé.',
    submitted: 'Bạn có thể xem lại các bước hoặc quay lại hướng dẫn.'
  };
  function show(stage, moveFocus = true) {
    get('instruction').innerHTML = simulation ? practiceHints[stage] : guide.instruction;
    const panelOpen = stage !== 'closed';
    const submitted = stage === 'submitted';
    get('closed').hidden = panelOpen;
    get('opened').hidden = !panelOpen;
    get('callout').hidden = panelOpen;
    get('submit').hidden = !panelOpen || submitted;
    get('receipt').hidden = !submitted;
    get('first').setAttribute('aria-current', panelOpen ? 'false' : 'step');
    get('second').setAttribute('aria-current', panelOpen ? 'step' : 'false');
    get('status').textContent = submitted ? 'Đã thử nộp bài.' : panelOpen ? 'Đã mở bảng hướng dẫn của Triết bên cạnh Codex.' : 'Ảnh màn hình Codex với nút Mở Triết.';
    if (moveFocus) get(submitted ? 'replay' : panelOpen ? 'submit' : 'open').focus({ preventScroll: true });
  }
  get('open').onclick = () => show('open');
  get('submit').onclick = () => show('submitted');
  get('replay').onclick = () => show('closed');
  get('first').onclick = () => show('closed', false);
  get('second').onclick = () => show('open', false);
  get('start').onclick = () => {
    simulation = !simulation;
    document.body.classList.toggle('simulation', simulation);
    get('context').textContent = simulation ? 'Mô phỏng thực hành' : guide.context;
    get('title').textContent = simulation ? guide.context : guide.title;
    get('steps').hidden = simulation;
    get('start').firstElementChild.textContent = simulation ? 'Quay lại hướng dẫn' : 'Bắt đầu thực hành';
    get('start').lastElementChild.textContent = simulation ? '↶' : '→';
    show('closed', false);
    get('title').focus({ preventScroll: true });
  };
</script>
